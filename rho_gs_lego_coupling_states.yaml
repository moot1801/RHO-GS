GLOBAL:
    LOG_LEVEL: 2
    GPU_INDICES: [0]
    RANDOM_SEED: 0
    ANOMALY_DETECTION: false
    FILTER_WARNINGS: true
    METHOD_TYPE: RHO_GS
    DATASET_TYPE: NeRF
MODEL:
    SH_DEGREE: 3
RENDERER:
    CONCATENATE_SH_COEFFICIENTS: true
    USE_TIGHT_BOUNDS: false
    USE_OPACITY_BASED_BOUNDS: false
    USE_FUSED_ACTIVATIONS: false
    USE_LOAD_BALANCED_INSTANCE_CREATION: false
    USE_TILE_BASED_CULLING: false
    USE_PER_GAUSSIAN_BACKWARD: false
    USE_SEPARATE_SORTING: false
    SCALE_MODIFIER: 1.0
TRAINING:
    LOAD_CHECKPOINT: null
    MODEL_NAME: rho_gs_lego_coupling_states_w20260729_001_r01
    NUM_ITERATIONS: 30_000
    DATA:
        PRELOADING_LEVEL: 1
        FIELDS: [rgb, alpha]
        PRECOMPUTE_RAYS: false
        RAYS_TO_DEVICE: false
    BACKUP:
        FINAL_CHECKPOINT: true
        RENDER_TESTSET: false
        RENDER_TRAINSET: false
        RENDER_VALSET: false
        INTERMEDIATE_RENDERINGS: false
        VISUALIZE_ERRORS: false
        INTERVAL: -1
        TRAINING_STATE: false
    TIMING:
        ACTIVATE: true
        INCLUDE_DATALOADING_IN_TOTAL: true
        INCLUDE_PRETRAINING_IN_TOTAL: true
        INCLUDE_POSTTRAINING_IN_TOTAL: false
    WANDB:
        ACTIVATE: false
    GUI:
        ACTIVATE: false
    WRITE_VRAM_STATS: true
    USE_MORTON_ORDERING: false
    TILE_GAUSSIAN_STATS:
        ACTIVE: false
    RANDOM_INITIALIZATION:
        FORCE: false
        N_POINTS: 100_000
        ENABLE_CARVING: true
        CARVING_IN_ALL_FRUSTUMS: false
        CARVING_ENFORCE_ALPHA: false
    OPTIMIZER:
        LEARNING_RATE_MEANS_INIT: 0.00016
        LEARNING_RATE_MEANS_FINAL: 1.6e-06
        LEARNING_RATE_MEANS_MAX_STEPS: 30_000
        LEARNING_RATE_SH_COEFFICIENTS_0: 0.0025
        LEARNING_RATE_SH_COEFFICIENTS_REST: 0.000125
        LEARNING_RATE_OPACITIES: 0.025
        LEARNING_RATE_SCALES: 0.005
        LEARNING_RATE_ROTATIONS: 0.001
        USE_FUSED_IMPL: false
        FORCE_PYTORCH_IMPL: true
        USE_APEX: false
    PORTABLE_STATE:
        ACTIVE: true
        ITERATIONS: [1_000, 15_000, 30_000]
        DIRECTORY: portable_states
DATASET:
    PATH: dataset/nerf_synthetic/lego
    IMAGE_SCALE_FACTOR: null
    NORMALIZE_CUBE: 2.6666666666666665
    NORMALIZE_RECENTER: false
    BACKGROUND_COLOR: [0.0, 0.0, 0.0]
    NEAR_PLANE: 2.0
    FAR_PLANE: 6.0
